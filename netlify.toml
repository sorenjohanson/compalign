[build]
	command = "npm run build"
	publish = "build"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "base-uri 'none'; form-action 'self'; default-src 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' plausible.io; img-src 'self' api.producthunt.com; connect-src 'self' plausible.io; style-src 'self' 'unsafe-inline';"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"