# Cloudflare Pages configuration
name = "comp-align"
compatibility_date = "2023-12-01"
pages_build_output_dir = "build"

# Environment variables for Supabase integration
[vars]
VITE_SUPABASE_URL = ""
VITE_SUPABASE_ANON_KEY = ""
ENABLE_COLLABORATION = "true"
ENABLE_COLLABORATION_API = "true"

# Security headers configuration
[[headers]]
for = "/*"

[headers.values]
Content-Security-Policy = "base-uri 'none'; form-action 'self'; default-src 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' plausible.io; img-src 'self' api.producthunt.com; connect-src 'self' plausible.io *.supabase.co; style-src 'self' 'unsafe-inline';"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# For production deployment, set these in the Cloudflare Dashboard:
# - VITE_SUPABASE_URL (your Supabase project URL)
# - VITE_SUPABASE_ANON_KEY (your Supabase anon key)
# - SUPABASE_SERVICE_ROLE_KEY (for server-side operations, if needed)