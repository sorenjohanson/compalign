name: CI

on:
  push:
    branches: [main, supabase-realtime]
  pull_request:
    branches: [main]

jobs:
  prettier:
    name: 'Prettier'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Prettier check
        run: npx prettier --write .

  eslint:
    name: 'ESLint'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
      - name: Run ESLint
        run: npx eslint . --ext .js,.ts,.svelte

  svelte-check:
    name: 'Svelte Check'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Svelte Check
        run: pnpm run check
        env:
          PUBLIC_AUTH_MODE: ''
          PUBLIC_COLLABORATION_MODE: ''
          PUBLIC_SUPABASE_URL: ''
          PUBLIC_SUPABASE_ANON_KEY: ''
          PUBLIC_STRIPE_PAYMENT_LINK: ''
          PUBLIC_STRIPE_WEBHOOK_SECRET: ''

  gitleaks:
    name: 'GitLeaks'
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          fetch-depth: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: 'SBOM create and scan'
    runs-on: ubuntu-latest

    steps:
      - name: Create SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: '${{ github.event.repository.name }}-sbom.spdx.json'

      - name: Scan SBOM
        uses: anchore/scan-action@v6
        with:
          sbom: '${{ github.event.repository.name }}-sbom.spdx.json'

  deploy:
    name: 'Deploy'
    needs: [prettier, eslint, svelte-check, gitleaks, sbom]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Deploy to Netlify
        run: npx netlify deploy --prod --dir=build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
